<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Sustainment Dashboard (maintainer)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Cmask%20id=%22f%22%3E%3Crect%20width=%22100%22%20height=%22100%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2280.21%22%20cy=%2226.4%22%20r=%2216.3%22%20fill=%22%23000%22/%3E%3C/mask%3E%3Ccircle%20cx=%2250%22%20cy=%2250%22%20r=%2238.33%22%20fill=%22none%22%20stroke=%22%2325394d%22%20stroke-width=%2213%22%20mask=%22url(%23f)%22/%3E%3Cg%20fill=%22%2325394d%22%3E%3Crect%20x=%2234%22%20y=%2234%22%20width=%2214%22%20height=%2214%22%20rx=%223%22/%3E%3Crect%20x=%2252%22%20y=%2234%22%20width=%2214%22%20height=%2214%22%20rx=%223%22/%3E%3Crect%20x=%2234%22%20y=%2252%22%20width=%2214%22%20height=%2214%22%20rx=%223%22/%3E%3Crect%20x=%2252%22%20y=%2252%22%20width=%2214%22%20height=%2214%22%20rx=%223%22/%3E%3C/g%3E%3Ccircle%20cx=%2280.21%22%20cy=%2226.4%22%20r=%2210.75%22%20fill=%22%23055795%22/%3E%3C/svg%3E">
<style>
/* Sustainment Dashboard: the look. It wears ORBIT's Harbor palette, as APEX does (slate ground, dark ink, navy menu
   down the left, blue accent), with APEX's own token names so a rule reads the same in both. Nothing is loaded from
   anywhere: the CSP allows no font or stylesheet but this. A status is always its colour AND its word. */
:root{
  --sbg:#c4ccd6; --sbg2:#d9dfe7; --spanel:#e6eaf0; --spanel2:#c9d0da; --sline:#aeb7c3; --sedge:#627185;
  --sink:#182029; --smut:#3b4553; --steal:#055795; --slink:#0b4f8a; --ssel:#c3d4e6; --soft:#d3e1ef;
  --acc:#25394d; --onAcc:#eaf0f6; --accHover:#3a536c;
  --card:#f5f7fa; --cardLine:#b9c2ce;
  --green:#00753a; --greenBg:#dcefe3; --ochre:#7a4a08; --ochreBg:#f3e6cf; --plan:#46505e; --planBg:#dde2e8;
  --a-plan:#055795; --a-exec:#2f6f4f; --a-contracts:#7a4a08; --a-other:#627185;
  --r:12px; --shadow:0 1px 2px rgba(24,32,41,.12),0 2px 8px rgba(24,32,41,.08);
  --shadowUp:0 4px 10px rgba(24,32,41,.16),0 10px 24px rgba(24,32,41,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;background:var(--sbg);color:var(--sink);font:14px/1.45 Calibri,Carlito,"Segoe UI",Arial,sans-serif;min-height:100vh}
.boot{padding:24px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.skip{position:absolute;left:8px;top:-60px;z-index:60;padding:8px 14px;background:var(--acc);color:var(--onAcc);font-weight:700;border-radius:0 0 8px 8px}
.skip:focus{top:0;outline:3px solid var(--onAcc);outline-offset:-4px}
button,input{font:inherit;color:inherit}

/* the top bar */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 28px}
.brand{display:flex;align-items:center;gap:10px;margin:0;font-size:20px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:34px;height:34px;flex:none;color:var(--sink);--mark-accent:var(--steal)}
  padding:3px 7px;border:1px solid var(--sline);border-radius:5px;background:var(--spanel);color:var(--smut)}

  border-radius:0 var(--r) var(--r) 0;max-height:calc(100vh - 90px);overflow-y:auto}
  background:none;color:var(--onAcc);text-align:left;cursor:pointer}
main:focus{outline:none}

  border-radius:var(--r);background:linear-gradient(120deg,var(--acc) 0%,#2f4b66 60%,#355a7d 100%);color:var(--onAcc);box-shadow:var(--shadow)}
.hero h2{margin:0 0 4px;font-size:24px;font-weight:700;color:#fff}
.hero p{margin:0;color:#cfdae6;max-width:60ch}

/* the status filter */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px}
.bar .lbl{font-weight:700;color:var(--slink);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 12px;border:1px solid var(--sedge);border-radius:999px;background:var(--card);cursor:pointer}
.chip:hover{background:var(--ssel)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.shown{margin-left:auto;color:var(--smut);font-size:13px}

/* sections and cards */
section.area{margin:22px 0 0}
section.area > header{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--sline)}
section.area h3{margin:0;font-size:17px;color:var(--acc)}
section.area h3 .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:1px}
section.area > header p{margin:0;color:var(--smut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 18px 16px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--cardLine);box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--area,var(--a-other))}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadowUp)}
.card.off{box-shadow:none}
.card .head{display:flex;align-items:flex-start;gap:12px}
.ico{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:11px;background:var(--acc);color:var(--onAcc);--mark-accent:#8fc1ec}
.ico svg{width:30px;height:30px}
.card h4{margin:0;font-size:18px;line-height:1.2}
.card .full{margin:2px 0 0;color:var(--smut);font-size:13px}
.st{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-live{color:var(--green);background:var(--greenBg);border-color:var(--green)}
.st-dev{color:var(--ochre);background:var(--ochreBg);border-color:var(--ochre)}
.st-planned{color:var(--plan);background:var(--planBg);border-color:var(--plan)}
.st-dev::before{background:none;border:2px solid currentColor;width:6px;height:6px}
.st-planned::before{background:none;border:1.5px dashed currentColor;width:6px;height:6px}
.tag{margin:0;color:var(--sink)}
.feat{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.feat li{padding:2px 9px;border-radius:6px;background:var(--soft);color:var(--slink);font-size:12px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 14px;border-radius:8px;border:1px solid var(--sedge);
  background:#fff;color:var(--sink);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ssel)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.btn.pri:hover{background:var(--accHover);color:#fff}
.btn svg{width:15px;height:15px}
.btn[aria-disabled=true]{background:var(--spanel2);border-color:var(--sline);color:var(--smut);cursor:not-allowed}
.hint{font-size:12px;color:var(--smut)}
mark{background:#fff0b3;color:inherit;border-radius:2px;padding:0 1px}

  border:1px solid var(--cardLine);color:var(--sink);text-decoration:none;font-weight:600}
.empty{margin:28px 0;padding:24px;border:2px dashed var(--sline);border-radius:var(--r);text-align:center;color:var(--smut)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;padding:8px 16px;border-radius:8px;background:var(--acc);color:var(--onAcc);
  box-shadow:var(--shadowUp);font-weight:600}
.toast[hidden]{display:none}
footer.foot{margin:28px 0 0;padding-top:10px;border-top:1px solid var(--sline);color:var(--smut);font-size:12px}

@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
@media print{.sbox,.tabs,.bar,.recent,.skip,.maint{display:none}.card{break-inside:avoid;box-shadow:none}}

/* the maintainer copy only (src/maint.js present): the gear, the note under the bar, and the Settings panel. Styles only; the team copy never draws them */
.gear{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border:1px solid var(--sedge);border-radius:999px;background:#fff;cursor:pointer;font-weight:600}
.gear:hover{background:var(--ssel)}
.gear svg{width:18px;height:18px}
.maint{padding:4px 20px;background:var(--ochreBg);border-bottom:1px solid var(--ochre);color:#5c3706;font-size:13px;font-weight:700}
.sdlg{width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:1px solid var(--sedge);border-radius:var(--r);background:var(--spanel);color:var(--sink);box-shadow:var(--shadowUp)}
.sdlg::backdrop{background:rgba(24,32,41,.45)}
.sdlg-in > header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--acc);color:var(--onAcc)}
.sdlg-in h2{margin:0;font-size:17px}
.sdlg .x{margin-left:auto;width:32px;height:32px;border:1px solid rgba(234,240,246,.5);border-radius:8px;background:none;color:var(--onAcc);font-size:20px;line-height:1;cursor:pointer}
.sdlg .x:hover{background:var(--accHover)}
.sdlg .x:focus-visible{outline-color:var(--onAcc)}
.snote{margin:12px 18px 4px;color:var(--smut);font-size:13px}
.slist{list-style:none;margin:0;padding:8px 18px 18px;display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:46px minmax(140px,180px) 1fr;align-items:center;gap:6px 14px;padding:12px 14px;border:1px solid var(--cardLine);border-radius:10px;background:var(--card)}
.srow .sname b{display:block;font-size:15px}
.sver{font-size:12px;color:var(--smut)}
.sacts{display:flex;flex-wrap:wrap;gap:8px}
.spath{grid-column:3;font-size:12px;color:var(--smut);overflow-wrap:anywhere}
.spath code{font-size:12px}
.err{color:#8c1d3f;font-weight:600}
@media (max-width:640px){.srow{grid-template-columns:46px 1fr}.srow > :nth-child(3),.spath{grid-column:1 / -1}.gear span{display:none}}

/* the catalog: dense rows, a file-type tile, the actions at the right */
.t-excel{background:#1d6f42}.t-powerpoint{background:#b7472a}.t-word{background:#2b579a}.t-pdf{background:#8c1d3f;font-size:10px}
.t-sharepoint{background:#036c70}.t-teams{background:#4b53bc}.t-folder{background:#627185}.t-web{background:var(--steal)}
.btn.sm{min-height:30px;padding:4px 11px;font-size:13px}

/* the maintainer bar and the catalog editor (maintainer copy only; the team copy never draws them) */
.maint{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 20px;background:var(--ochreBg);border-bottom:1px solid var(--ochre);color:#5c3706;font-size:13px;font-weight:700}
.maint .sp{flex:1}
.maint .mb{min-height:30px;padding:4px 12px;border:1px solid var(--ochre);border-radius:8px;background:#fff;color:#5c3706;font-weight:700;cursor:pointer}
.maint .mb:hover{background:#fbf1de}
.maint .mb[aria-pressed=true]{background:#5c3706;color:#fff;border-color:#5c3706}
.maint .mb.pri{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.maint .mb.pri[aria-disabled=true]{background:var(--spanel2);border-color:var(--sline);color:var(--smut);cursor:default}
.maint .pill{padding:2px 10px;border-radius:999px;border:1px solid var(--sedge);background:#fff;color:var(--sink);font-weight:700}
.maint .pill.warn{background:var(--ochre);border-color:var(--ochre);color:#fff}
.dot-warn{color:var(--ochre)}
.btn.danger{color:#8c1d3f;border-color:#8c1d3f}
.btn.danger:hover{background:#f7e3ea}
.btn.pri.danger{background:#8c1d3f;color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.addsec{margin:18px 0 0}
.eform{display:flex;flex-direction:column;gap:12px;padding:16px 18px 4px}
.ef{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ef label{font-weight:700;font-size:13px}
.ef input,.ef select{width:100%;min-height:36px;padding:6px 10px;border:1px solid var(--sedge);border-radius:8px;background:#fff;font-size:14px}
.eh{font-size:12px;color:var(--smut)}
.erow{display:flex;flex-wrap:wrap;gap:12px}
.eerr{margin:0;min-height:1.2em;color:#8c1d3f;font-weight:700;font-size:13px}
.sdlg footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--sline);margin-top:8px}
.sdlg footer .sp{flex:1}

/* A link not set yet is told apart by a dashed edge, never by fading: fading took the Live badge under 4.5:1 (npm run a11y).
   The editor's buttons darken their coloured header, never lighten it, for the same reason. */
/* ---- layout D (Brad, 22 Nov 2026): the welcome band with the search and the tabs, pinned tiles, tools, section cards */
header.top .tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.tpill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;background:var(--sbg2);border:1px solid var(--sline);color:var(--sink);text-decoration:none;font-size:13px}
.tpill:hover{background:var(--ssel)}
.tpill svg{width:14px;height:14px;color:#a36a00}
.hero2{margin:0 28px;padding:28px 32px 0;border-radius:18px;text-align:center;color:var(--onAcc);
  background:radial-gradient(circle at 85% 0%,#3b6a94 0%,var(--acc) 58%);box-shadow:var(--shadow)}
.hero2 h2{margin:0;font-size:28px;line-height:1.2;color:#fff}
.hero2 > p{margin:6px 0 16px;color:#cfdae6}
.sbox{position:relative;max-width:680px;margin:0 auto}
.sbox svg{position:absolute;left:18px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--smut);pointer-events:none}
.sbox input{width:100%;padding:13px 54px 13px 46px;border:0;border-radius:999px;background:#fff;color:var(--sink);font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sbox input::placeholder{color:#5d6878}
.sbox input:focus-visible{outline:3px solid #8fc1ec;outline-offset:2px}
.sbox kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:12px/1 Calibri,Carlito,"Segoe UI",Arial,sans-serif;padding:4px 8px;border:1px solid var(--sline);border-radius:6px;background:var(--spanel);color:var(--smut)}
.sbox input:focus + kbd,.sbox input:not(:placeholder-shown) + kbd{display:none}
.tabs{display:flex;justify-content:center;gap:4px;margin-top:22px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:9px 18px;border:0;border-radius:11px 11px 0 0;background:none;color:#cfdae6;font-weight:600;cursor:pointer}
.tab:hover{background:rgba(234,240,246,.12);color:#fff}
.tab[aria-pressed=true]{background:var(--sbg);color:var(--acc);font-weight:800}
.tab i{font-style:normal;font-size:11px;min-width:20px;padding:0 6px;border-radius:999px;background:rgba(234,240,246,.18)}
.tab[aria-pressed=true] i{background:var(--acc);color:#fff}
.tab:focus-visible{outline:3px solid #8fc1ec;outline-offset:-3px}
main{padding:6px 28px 36px}
h2.sh{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--smut)}
h2.sh svg{width:15px;height:15px;color:#a36a00}
h2.sh small{margin-left:auto;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none}
.lnk{border:0;background:none;padding:0;color:var(--slink);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.shown.big{margin:18px 0 0;font-size:14px}
.pinhint{margin:0;color:var(--smut);font-size:13px}
/* recently opened */
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 0}
.recent .lbl{font-weight:700;color:var(--slink);font-size:13px}
.rchip{display:inline-flex;align-items:center;min-height:30px;padding:3px 12px;border-radius:999px;background:var(--card);border:1px solid var(--cardLine);color:var(--sink);text-decoration:none;font-weight:600;font-size:13px}
.rchip:hover{background:var(--ssel)}
/* pinned tiles */
.fav{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.fav li{position:relative}
.ftile{display:flex;flex-direction:column;align-items:center;gap:9px;height:100%;padding:16px 8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--cardLine);
  box-shadow:var(--shadow);color:var(--sink);text-decoration:none;font-weight:700;font-size:13px;text-align:center;transition:transform .15s,box-shadow .15s}
a.ftile:hover{transform:translateY(-2px);box-shadow:var(--shadowUp)}
.ftile.off{border-style:dashed;box-shadow:none}
.funpin{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--smut);font-size:16px;line-height:1;cursor:pointer;opacity:0}
.fav li:hover .funpin,.funpin:focus-visible{opacity:1}
.funpin:hover{background:var(--spanel2);color:var(--sink)}
/* the slim tools row */
.trow{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.ttile{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--cardLine);border-top:4px solid var(--area);
  box-shadow:var(--shadow);color:var(--sink);text-decoration:none;transition:transform .15s,box-shadow .15s}
a.ttile:hover{transform:translateY(-2px);box-shadow:var(--shadowUp)}
.ttile.off{border-style:dashed;border-top-style:solid;box-shadow:none}
.ico.sm{width:40px;height:40px;border-radius:10px}.ico.sm svg{width:26px;height:26px}
.tt{min-width:0}.tt b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:15px}.tt small{display:block;color:var(--smut);font-size:12.5px}
.tt .st{margin-left:0;font-size:11px;padding:0 8px}
/* section cards, in columns */
.mason{columns:4 270px;column-gap:16px}
.scard{break-inside:avoid;display:block;margin:0 0 16px;border-radius:14px;background:#fff;border:1px solid var(--cardLine);overflow:hidden;box-shadow:var(--shadow)}
.scard > header{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:10px 14px;background:var(--sc);color:#fff}
.scard h3{margin:0;font-size:15px;color:#fff}
.scard .sn{margin-left:auto;font-size:12px;opacity:.9}
.sblurb{margin:0;padding:8px 14px;font-size:12.5px;color:var(--smut);border-bottom:1px solid #edf0f4}
.sempty{margin:0;padding:16px 14px;color:var(--smut);font-size:13px;font-style:italic}
.llist{list-style:none;margin:0;padding:0}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;border-top:1px solid #edf0f4}
.lrow:first-child{border-top:0}
.lrow:hover{background:#f2f5f9}
.ctype{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:7px;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em}
.ctype.lg{width:44px;height:44px;border-radius:11px;font-size:18px}
.t-excel{background:#1d6f42}.t-powerpoint{background:#b7472a}.t-word{background:#2b579a}.t-pdf{background:#8c1d3f;font-size:9.5px}.ctype.lg.t-pdf{font-size:12px}
.t-form{background:#7a4a08}.t-sharepoint{background:#036c70}.t-teams{background:#4b53bc}.t-folder{background:#627185}.t-web{background:var(--steal)}
.lmain{display:flex;flex-direction:column;min-width:0;flex:1}
.cname{font-weight:700;color:var(--slink);text-decoration:none;overflow-wrap:anywhere}
a.cname:hover{text-decoration:underline}
.cname.nolink{color:var(--sink)}
.lmain small{color:var(--smut);font-size:12px;overflow-wrap:anywhere}
.lacts{display:flex;align-items:center;gap:2px;flex:none}
/* Browser, Copy link and the report flag sit OVER the row, beside the star, and show on hover or when the keyboard
   reaches them. They take no room and never move anything: a version that widened on hover rewrapped the name, the
   columns rebalanced, and the cards jumped under the pointer (npm test caught it as a click that could never land). */
.lacts{position:relative}
.lmore{position:absolute;right:100%;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:8px;

  const name = team ? 'sustainment-dashboard.html' : (IS_MAINT() ? 'sustainment-dashboard-maintainer.html' : thisFileName());
  const want = team || !IS_MAINT() ? 'team' : 'maint', key = team || !IS_MAINT() ? 'teamFile' : 'maintFile';
  let h = handle, fresh = false;
  try {
    if (!h) {

        if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') h = null;

    if (h && !theirs) {
      const r = await readHandle(h);
      if (r.kind === 'other') { alert('Not saved: “' + h.name + '” is not a Sustainment Dashboard file, and is left as it was.'); return false; }
      if (r.kind !== 'empty' && r.kind !== 'unreadable' && r.kind !== want) { alert('Not saved: “' + h.name + '” is the ' + (r.kind === 'maint' ? 'maintainer copy' : 'team copy') + '.'); await IDB.set(key, null); return false; }
      if (r.cat) theirs = r.cat;
    }
  } catch { h = null; }
  const prev = plainCat();
  const m = mergeInto(theirs, base === undefined ? ED.base : base);

  const stamp = new Date().toISOString(), by = who() || 'someone';
  if (m.changes.length) {
    CATALOG.log = (CATALOG.log || []).concat(m.changes.slice(0, 40).map(what => ({ t: stamp, who: by, what })).concat(m.changes.length > 40 ? [{ t: stamp, who: by, what: 'and ' + (m.changes.length - 40) + ' more changes' }] : [])).slice(-LOG_MAX);

  try { html = htmlWith({ ...CATALOG, meta: { ...CATALOG.meta, updated: stamp, version: VERSION } }, team); }
  catch (e) { CATALOG = { ...prev, fixed: [] }; alert('Not saved: ' + e.message); return false; }
  const done = how => {
    CATALOG.meta.updated = stamp; CATALOG.meta.version = VERSION;
    let msg = (how === 'written' ? 'Saved to ' + h.name : name + ' downloaded') + (m.kept ? '. Kept ' + m.kept + ' change(s) others had saved' : '');
    if (m.conflicts.length) msg += '. Both you and someone else changed ' + m.conflicts.join(', ') + ': yours was kept';

function importMerge(cat, dry) {

  const tset0 = new Set((CATALOG.tools || []).map(x => x.id)), tn = (cat.tools || []).filter(x => !tset0.has(x.id)).length;
  if (dry) return [n(links.length, 'link'), n(secs.length, 'section'), n(terms.length, 'term'), n(news.length, 'announcement'), n(tn, 'tool link')].join(', ');

  CATALOG.notices = (CATALOG.notices || []).concat(news);

  if (!CATALOG.meta.office && cat.meta.office) CATALOG.meta.office = cat.meta.office;

// ---- Excel out: every link as a spreadsheet (CSV, which Excel opens), for a review, a backup or a hand-over
const csvCell = v => {
  let t = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // a cell Excel would run as a formula is written as text
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};
const CSV_COLS = ['Name', 'Link', 'Section', 'Type', 'Note', 'Date', 'Keywords', 'Last checked'];
function exportCsv() {
  const rows = [CSV_COLS].concat(citems().sort((a, b) => cats().findIndex(k => k.id === a.category) - cats().findIndex(k => k.id === b.category) || linkOrder(a, b))
    .map(c => [c.name, c.url, (catOf(c) || {}).name || 'Other', (TYPES[c.type] || TYPES.web).label, c.note, c.date || '', c.keywords || '', c.checked || '']));
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'sustainment-dashboard-links-' + today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Exported ' + (rows.length - 1) + ' links');
}

// ---- Excel in: rows pasted from a spreadsheet. Checked first, then added in one go; a name already in the catalog is

function pasteForm() {
  dlg('<header><h2 id="sdlgT">Paste links from Excel</h2><button type="button" class="x" data-e="close" aria-label="Close">×</button></header><div class="eform">'
    + '<p class="eh">In Excel, select the rows (with their heading row) and copy; paste them below. Columns, by heading: <b>Name</b> and <b>Link</b>, and any of Section, Type, Note, Date, Keywords. '
    + 'Without headings the columns are read in that order. A name already in the catalog updates that link; a new section is made for you. Type left empty is worked out from the link.</p>'
    + '<textarea id="pIn" rows="9" spellcheck="false" placeholder="Name&#9;Link&#9;Section&#9;Type&#9;Note"></textarea>'
    + '<div id="pOut" role="status"></div></div>'
    + '<footer><span class="sp"></span><button type="button" class="btn" data-e="close">Cancel</button><button type="button" class="btn" data-e="pasteCheck">Check</button>'
    + '<button type="button" class="btn pri" data-e="pasteAdd" disabled>Add them</button></footer>', '#pIn');
  document.getElementById('pIn').addEventListener('input', () => { document.querySelector('[data-e="pasteAdd"]').disabled = true; document.getElementById('pOut').innerHTML = ''; });
}
function splitRows(t) {   // tab-separated (what Excel copies) or comma-separated, with quoted cells
  const sep = t.includes('\t') ? '\t' : ',', rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"' && t[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; continue; }
    if (ch === '"' && cell === '') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function pasteDate(v) {
  if (!v) return '';
  if (dateOk(v)) return v;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(v);   // 11/22/2026, as Excel shows a date in the US
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3], d = y + '-' + m[1].padStart(2, '0') + '-' + m[2].padStart(2, '0'); if (dateOk(d)) return d; }
  return null;
}
function pasteCheck(apply) {
  const out = document.getElementById('pOut'), rows = splitRows(document.getElementById('pIn').value);
  if (!rows.length) { out.innerHTML = '<p class="eerr">Nothing to read: paste the rows first.</p>'; return; }
  const H = { name: /^(name|title)$/, url: /^(link|url|address|web address)$/, section: /^(section|category|group)$/, type: /^(type|kind)$/, note: /^(note|notes|description|topic)$/, date: /^(date|when)$/, keywords: /^(keywords?|tags?)$/ };
  const first = rows[0].map(c => c.toLowerCase()), col = {};
  const hasHead = first.some(c => H.name.test(c)) && first.some(c => H.url.test(c));
  if (hasHead) first.forEach((c, i) => { for (const k in H) if (H[k].test(c) && !(k in col)) col[k] = i; });
  else ['name', 'url', 'section', 'type', 'note', 'date', 'keywords'].forEach((k, i) => { col[k] = i; });
  const body = hasHead ? rows.slice(1) : rows, errs = [], adds = [], upd = [], newSecs = new Map();
  const typeOf = v => { const l = v.toLowerCase(); return Object.keys(TYPES).find(k => k === l || TYPES[k].label.toLowerCase() === l) || (l === 'website' || l === 'site' ? 'web' : l === 'video' ? 'video' : ''); };
  body.forEach((r, i) => {
    const n = (hasHead ? i + 2 : i + 1), get = k => (col[k] === undefined ? '' : (r[col[k]] || ''));
    const name = get('name'), url = get('url'), secName = get('section'), tv = get('type'), date = pasteDate(get('date'));
    if (!name) { errs.push('row ' + n + ': no name'); return; }
    if (url && !linkOk(url)) { errs.push('row ' + n + ' (' + name + '): the link cannot be opened (use ' + LINK_HELP + ')'); return; }
    if (date === null) { errs.push('row ' + n + ' (' + name + '): “' + get('date') + '” is not a date'); return; }
    let type = tv ? typeOf(tv) : (guessType(url) || 'web');
    if (!type) { errs.push('row ' + n + ' (' + name + '): type “' + tv + '” is not one of ' + Object.values(TYPES).map(t => t.label).join(', ')); return; }
    let sec = secName ? cats().find(k => k.name.toLowerCase() === secName.toLowerCase() || k.id === secName.toLowerCase()) : null;
    if (secName && !sec) { const key = secName.toLowerCase(); if (!newSecs.has(key)) newSecs.set(key, secName); }
    const rec = { name, url, note: get('note'), type, secName, date: date || '', keywords: get('keywords') };
    (citems().some(c => c.name.toLowerCase() === name.toLowerCase()) ? upd : adds).push(rec);
  });
  const sum = '<p><b>' + adds.length + '</b> new link' + (adds.length === 1 ? '' : 's') + ', <b>' + upd.length + '</b> to update'
    + (newSecs.size ? ', new section' + (newSecs.size > 1 ? 's' : '') + ': ' + [...newSecs.values()].map(esc).join(', ') : '') + '.</p>'
    + (errs.length ? '<p class="eerr">' + errs.length + ' row' + (errs.length > 1 ? 's' : '') + ' left out:</p><ul class="perr">' + errs.slice(0, 12).map(e => '<li>' + esc(e) + '</li>').join('') + (errs.length > 12 ? '<li>…and ' + (errs.length - 12) + ' more</li>' : '') + '</ul>' : '');
  if (!apply) { out.innerHTML = sum; document.querySelector('[data-e="pasteAdd"]').disabled = !(adds.length + upd.length); return; }
  for (const [key, nm] of newSecs) CATALOG.categories.push({ id: slugId(nm, new Set(cats().map(k => k.id))), name: nm, blurb: '' });
  const secId = nm => nm ? (cats().find(k => k.name.toLowerCase() === nm.toLowerCase() || k.id === nm.toLowerCase()) || {}).id : ((cats()[0] || {}).id || '');
  const taken = new Set(CATALOG.items.map(x => ckey(x).slice(2)));
  for (const r of adds.concat(upd)) {
    const ex = CATALOG.items.find(c => c.name.toLowerCase() === r.name.toLowerCase());
    const it = ex || { name: r.name, id: slugId(r.name, taken), note: '', url: '', type: r.type, category: secId(r.secName) };
    if (!ex) { taken.add(it.id); CATALOG.items.push(it); }
    if (r.url) { if (r.url !== it.url) delete it.checked; it.url = r.url; }
    if (r.note) it.note = r.note;
    if (r.secName || !ex) it.category = secId(r.secName);
    if (r.type) it.type = r.type;
    if (r.date) it.date = r.date;
    if (r.keywords) it.keywords = r.keywords;
  }
  dlgClose(); edKeep();
  toast('Added ' + adds.length + ', updated ' + upd.length + ' (not saved yet)');
}

const KIND = {   // the tabs that gather links by what they are, whatever section they sit in
  files: { label: 'Files',    types: ['excel', 'powerpoint', 'word', 'pdf', 'video', 'folder'] },
  web:   { label: 'Websites', types: ['web', 'sharepoint', 'teams'] },
  forms: { label: 'Forms',    types: ['form'] },
};
// each section's colour: the starting sections have their own; any other takes one from the palette by its id, so it
// keeps its colour when sections are reordered. White text clears 4.5:1 on every one.
const SEC_COLOR = { trackers: '#1d6f42', briefings: '#b7472a', forms: '#7a4a08', websites: '#055795', af: '#25394d', navy: '#1f3f73', training: '#5b3a8c', reference: '#5d6878', sites: '#036c70' };
const SEC_PALETTE = ['#055795', '#1d6f42', '#7a4a08', '#8c1d3f', '#036c70', '#4b53bc', '#25394d', '#5d6878', '#b7472a'];
const secColor = id => SEC_COLOR[id] || SEC_PALETTE[[...String(id)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7) % SEC_PALETTE.length];
const S = {
  tab: String(store.get('tab', 'all')),
  status: store.get('status', 'all'),
  q: '',
  more: new Set(),   // sections opened with Show all, for this visit
};
const areas = () => DASH.areas || [];
// a tool's link is the one this office set in the page (CATALOG.tools), else the one in the tool list
const toolSet = id => (CATALOG.tools || []).find(x => x.id === id);
const tools = () => (DASH.tools || []).map(t => { const o = toolSet(t.id); return o ? { ...t, url: o.url, urlSet: true } : { ...t }; });
const areaOf = t => areas().find(a => a.id === t.area);
const cats = () => CATALOG.categories || [];
const citems = () => (CATALOG.items || []).slice();
const catOf = c => cats().find(k => k.id === c.category);
const ckey = c => 'c:' + (c.id || String(c.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
const tabSecs = () => cats().filter(k => k.tab);
const glossary = () => CATALOG.glossary || [];
const glossOn = () => glossary().length > 0 || editing();
const tabOk = v => v === 'all' || v === 'tools' || !!KIND[v] || (v === 'gloss' && glossOn()) || (v.startsWith('s:') && tabSecs().some(k => 's:' + k.id === v));
if (!tabOk(S.tab)) S.tab = 'all';
if (S.status !== 'all' && !STATUS[S.status]) S.status = 'all';
const pins = () => { const p = store.get('pins', []); return Array.isArray(p) ? p : []; };
// the links the tab on screen covers
function tabLinks(tab) {
  const all = citems();
  if (KIND[tab]) return all.filter(c => KIND[tab].types.includes(c.type));
  if (tab.startsWith('s:')) return all.filter(c => c.category === tab.slice(2));
  if (tab === 'tools') return [];
  return all;
}

function matches(t, q) {
  if (!q) return true;
  const hay = [t.name, t.full, t.tagline, (t.features || []).join(' '), (areaOf(t) || {}).name, (STATUS[t.status] || {}).label].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
// the search words, marked where they appear in a piece of text (escaped first, so a mark never meets markup)
let _hlQ = null, _hlRe = null;
function hl(text) {
  const s = esc(text);
  if (_hlQ !== S.q) {
    _hlQ = S.q;
    const words = S.q.trim().split(/\s+/).filter(w => w.length > 1).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    _hlRe = words.length ? new RegExp('(' + words.join('|') + ')', 'gi') : null;
  }
  return _hlRe ? s.replace(_hlRe, '<mark>$1</mark>') : s;
}
function cmatches(c, q) {
  if (!q) return true;
  const hay = [c.name, c.note, c.keywords, (catOf(c) || {}).name, (TYPES[c.type] || {}).label, c.date ? c.date + ' ' + dateTxt(c.date) : ''].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function gmatches(g, q) {
  const hay = (g.term + ' ' + g.meaning).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
const byStatus = (a, b) => ((STATUS[a.status] || { order: 9 }).order - (STATUS[b.status] || { order: 9 }).order);

// ---- how a link opens. Office files open in the desktop app (ms-excel:ofe|u|<address>), never the browser preview;
// the browser hands the address to Office and stays where it is, so no new tab. Everything else opens in a new tab.
function hrefOf(c) {
  if (!linkOk(c.url)) return null;
  const T = TYPES[c.type] || TYPES.web, url = c.url.trim();
  // a file on a network share opens as itself: Office's own form takes web addresses only
  if (!isWeb(url)) return { href: linkHref(url), tab: true };
  return T.app ? { href: T.app + ':ofe|u|' + url, tab: false, web: url, app: T.appName } : { href: url, tab: true };
}
const aOpen = (c, k, cls, inner, extra) => {
  const h = hrefOf(c);
  return '<a class="' + cls + '" href="' + esc(h.href) + '"' + (h.tab ? ' target="_blank" rel="noopener noreferrer"' : '') + ' data-open="' + esc(k) + '"' + (extra || '') + '>' + inner + '</a>';
};
const typeTile = (c, size) => { const T = TYPES[c.type] || TYPES.web; return '<span class="ctype t-' + esc(TYPES[c.type] ? c.type : 'web') + (size ? ' ' + size : '') + '" title="' + esc(T.label) + '" aria-hidden="true">' + esc(T.mark) + '</span>'; };
const pinBtn = (c, k) => { const on = pins().includes(k); return '<button type="button" class="pin" data-pin="' + esc(k) + '" aria-pressed="' + on + '" title="' + (on ? 'Unpin' : 'Pin to the top') + '" aria-label="Pin ' + esc(c.name) + '">' + (on ? UI.pinOn : UI.pin) + '</button>'; };

// ---- the tools
function card(t) {
  const st = STATUS[t.status] || { label: t.status || 'Unknown', cls: 'st-planned' };
  const ok = linkOk(t.url);
  const color = AREA_COLOR[t.area] || 'var(--a-other)';
  const feats = (t.features || []).slice(0, 4).map(f => '<li>' + hl(f) + '</li>').join('');
  const open = ok
    ? '<a class="btn pri" href="' + esc(linkHref(t.url)) + '" target="_blank" rel="noopener noreferrer" data-open="' + esc(t.id) + '">' + UI.open + 'Open ' + esc(t.name) + '</a>'
      + '<button type="button" class="btn" data-copy="' + esc(t.id) + '">' + UI.copy + 'Copy link</button>'
    : '<span class="btn" aria-disabled="true" role="link" title="This tool’s link has not been set yet">'
      + (t.status === 'live' ? 'Link not set' : 'Not open yet') + '</span>';
  return '<article class="card' + (ok ? '' : ' off') + '" style="--area:' + color + '" aria-labelledby="t-' + esc(t.id) + '">'
    + '<div class="head"><span class="ico">' + iconOf(t) + '</span><div><h4 id="t-' + esc(t.id) + '">' + hl(t.name) + '</h4>'
    + (t.full ? '<p class="full">' + hl(t.full) + '</p>' : '') + '</div>'
    + '<span class="st ' + st.cls + '">' + esc(st.label) + '</span></div>'
    + '<p class="tag">' + hl(t.tagline) + '</p>'
    + (feats ? '<ul class="feat" aria-label="What is inside">' + feats + '</ul>' : '')
    + '<div class="acts">' + open + '</div></article>';
}
// the slim row on Everything: one line per tool, the whole tile opens it
function toolTile(t) {
  const st = STATUS[t.status] || { label: t.status, cls: 'st-planned' }, ok = linkOk(t.url);
  const inner = '<span class="ico sm">' + iconOf(t) + '</span><span class="tt"><b>' + hl(t.name) + ' <span class="st ' + st.cls + '">' + esc(st.label) + '</span></b>'
    + '<small>' + hl(t.full || t.tagline) + '</small></span>';
  return ok
    ? '<a class="ttile" style="--area:' + (AREA_COLOR[t.area] || 'var(--a-other)') + '" href="' + esc(linkHref(t.url)) + '" target="_blank" rel="noopener noreferrer" data-open="' + esc(t.id) + '">' + inner + '</a>'
    : '<div class="ttile off" style="--area:' + (AREA_COLOR[t.area] || 'var(--a-other)') + '" title="' + (t.status === 'live' ? 'This tool’s Teams link has not been set yet' : 'Not open yet') + '">' + inner + '</div>';
}
function toolsTab() {
  const chip = (v, l) => '<button type="button" class="chip" data-status="' + v + '" aria-pressed="' + (S.status === v) + '">' + esc(l) + '</button>';
  const vis = tools().filter(t => (S.status === 'all' || t.status === S.status) && matches(t, S.q)).sort(byStatus);
  let h = '<div class="bar" role="group" aria-label="Show tools by status"><span class="lbl">Show</span>' + chip('all', 'All')
    + Object.keys(STATUS).filter(k => tools().some(t => t.status === k)).map(k => chip(k, STATUS[k].label)).join('')
    + '<span class="shown" role="status">' + vis.length + ' of ' + tools().length + ' tools</span></div>';
  let any = false;
  for (const a of areas().concat([{ id: '', name: 'Other', blurb: '' }])) {
    const list = vis.filter(t => a.id ? t.area === a.id : !areaOf(t));
    if (!list.length) continue;
    any = true;
    h += '<section class="area"><header><h3><span class="sw" style="background:' + (AREA_COLOR[a.id] || 'var(--a-other)') + '"></span>' + esc(a.name) + '</h3>'
      + (a.blurb ? '<p>' + esc(a.blurb) + '</p>' : '') + '</header><div class="grid">' + list.map(card).join('') + '</div></section>';
  }
  return h + (any ? '' : '<div class="empty">No tool here.</div>');
}

// ---- the catalog: a section card holds its links, each a row whose name opens it
function lrow(c) {
  const k = ckey(c), h = hrefOf(c), T = TYPES[c.type] || TYPES.web;
  const name = h ? aOpen(c, k, 'cname', hl(c.name), ' title="' + esc(T.app ? 'Opens in ' + T.app + ' desktop app' : 'Opens in a new tab') + '"') : '<span class="cname nolink" title="Link not set yet">' + hl(c.name) + '</span>';
  const web = h && h.web ? '<a class="lweb" href="' + esc(h.web) + '" target="_blank" rel="noopener noreferrer" data-open="' + esc(k) + '" title="Open in the browser instead">Browser<span class="vh"> version of ' + esc(c.name) + ' (opens in a new tab)</span></a>' : '';
  return '<li class="lrow' + (h ? '' : ' off') + '">' + typeTile(c) + '<span class="lmain">' + name
    + '<small>' + (c.date ? '<span class="ldate' + (c.date >= today() ? ' up' : '') + '">' + esc(dateTxt(c.date)) + '</span>' : '')
    + (c.note ? hl(c.note) : c.date ? '' : esc(T.label)) + (h ? '' : ' · link not set') + '</small></span>'
    + '<span class="lacts">' + (h ? '<span class="lmore" data-k="' + esc(k) + '"></span>' : '')
    + HOOK('rowActs', c, k) + pinBtn(c, k) + '</span></li>';
}
// Browser, Copy link and Report, for ONE row: filled in when the row is hovered or the keyboard reaches it (rowReached),
// never up front. On every row they were 1,800 icons and a long email address each, and with 600 links the browser
// spent more than half a second laying out controls nobody could see.
function lmoreHtml(c, k) {
  const h = hrefOf(c); if (!h) return '';
  return (h.web ? '<a class="lweb" href="' + esc(h.web) + '" target="_blank" rel="noopener noreferrer" data-open="' + esc(k) + '" title="Open in the browser instead">Browser<span class="vh"> version of ' + esc(c.name) + ' (opens in a new tab)</span></a>' : '')
    + '<button type="button" class="lic" data-ccopy="' + esc(k) + '" title="Copy link" aria-label="Copy the link to ' + esc(c.name) + '">' + UI.copy + '</button>'
    + (CATALOG.meta.contact ? '<a class="lic" href="' + esc(mailto('Broken link on the Sustainment Dashboard: ' + c.name,
        'The link “' + c.name + '” (' + ((catOf(c) || {}).name || 'Other') + ') does not open, or opens the wrong thing.\n\nLink: ' + c.url.trim() + '\n\nWhat happened:\n')) + '" title="Report a broken link" aria-label="Report a broken link: ' + esc(c.name) + '">' + UI.flag + '</a>' : '');
}
function rowReached(e) {
  const m = e.target.closest && e.target.closest('.lrow') && e.target.closest('.lrow').querySelector('.lmore:empty'); if (!m) return;
  const c = citems().find(x => ckey(x) === m.dataset.k); if (c) m.innerHTML = lmoreHtml(c, m.dataset.k);
}
// a touch screen has no hover: there every row's controls are drawn (and phones list fewer links at a time)
const noHover = () => { try { return matchMedia('(hover: none)').matches; } catch { return false; } };
function secCard(g, list, o = {}) {
  const color = o.color || (g.id ? secColor(g.id) : '#5d6878'), hid = 'sc-' + esc(o.sub || g.id || 'other');
  return '<section class="scard" style="--sc:' + color + '" aria-labelledby="' + hid + '"><header><h3 id="' + hid + '">' + esc(g.name) + '</h3>'
    + '<span class="sn">' + (o.total || list.length) + ' link' + ((o.total || list.length) === 1 ? '' : 's') + '</span>' + (o.acts !== undefined ? o.acts : g.id ? HOOK('sectionActs', g) : '') + '</header>'
    + (g.blurb && (editing() || !list.length) ? '<p class="sblurb">' + esc(g.blurb) + '</p>' : '')
    + (list.length ? '<ul class="llist">' + list.map(lrow).join('') + '</ul>' : '<p class="sempty">' + esc(o.empty || 'No links in this section yet.') + '</p>')
    + (o.total ? '<button type="button" class="smore" data-more="' + esc(g.id) + '">Show all ' + o.total + ' links<span class="vh"> in ' + esc(g.name) + '</span> ›</button>' : '') + '</section>';
}
const CARD_CAP = 12;   // on Everything, a section shows this many links and a Show all button; its own tab and search show all
function catalogCards(links, opts = {}) {
  const ed = editing() && !S.q;
  const groups = cats().concat([{ id: '', name: 'Other', blurb: '' }]);
  let h = '', n = 0;
  for (const g of groups) {
    if (opts.only && g.id !== opts.only) continue;
    const list = links.filter(c => g.id ? c.category === g.id : !catOf(c)).sort(linkOrder);
    if (!list.length && !(ed && g.id && !opts.byKind) && !(opts.only && g.id === opts.only)) continue;
    const cap = opts.cap && list.length > CARD_CAP + 3 && !S.more.has(g.id) ? CARD_CAP : 0;   // while editing too: Show all is one click
    n++; h += secCard(g, cap ? list.slice(0, cap) : list, cap ? { total: list.length } : {});
  }
  return n ? '<div class="mason">' + h + '</div>' : '';
}

// ---- the top of Everything: recently opened and the pinned tiles
function recentHtml() {
  const ids = store.get('recent', []);
  const list = (Array.isArray(ids) ? ids : []).map(id => {
    if (String(id).startsWith('c:')) {
      const c = citems().find(x => ckey(x) === id);
      return c && hrefOf(c) ? aOpen(c, id, 'rchip', esc(c.name)) : null;
    }
    const t = tools().find(x => x.id === id);
    return t && linkOk(t.url) ? '<a class="rchip" href="' + esc(linkHref(t.url)) + '" target="_blank" rel="noopener noreferrer" data-open="' + esc(id) + '">' + esc(t.name) + '</a>' : null;
  }).filter(Boolean).slice(0, 6);
  return list.length ? '<div class="recent"><span class="lbl">Recently opened</span>' + list.join('') + '</div>' : '';
}
function pinnedHtml() {
  const P = pins(), list = citems().filter(c => P.includes(ckey(c))).sort((a, b) => P.indexOf(ckey(a)) - P.indexOf(ckey(b)));
  if (!list.length) return '<h2 class="sh" id="pinned">' + UI.pinOn + 'Pinned</h2><p class="pinhint">Star a link (☆) to pin it here. Pins are kept in your browser.</p>';
  return '<h2 class="sh" id="pinned">' + UI.pinOn + 'Pinned<small>your favourites, in this browser</small></h2><ul class="fav">' + list.map(c => {
    const k = ckey(c), inner = typeTile(c, 'lg') + '<span>' + esc(c.name) + '</span>';
    return '<li>' + (hrefOf(c) ? aOpen(c, k, 'ftile', inner) : '<span class="ftile off" title="Link not set yet">' + inner + '</span>')
      + '<button type="button" class="funpin" data-pin="' + esc(k) + '" aria-pressed="true" aria-label="Unpin ' + esc(c.name) + '" title="Unpin">×</button></li>';
  }).join('') + '</ul>';
}

// ---- the welcome band and its tabs
function greet() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function tabsHtml() {
  const t = (v, label, n) => '<button type="button" class="tab" data-tab="' + esc(v) + '" aria-pressed="' + (S.tab === v) + '">' + esc(label) + '<i>' + n + '</i></button>';
  return '<div class="tabs" role="group" aria-label="Show">' + t('all', 'Everything', tools().length + citems().length) + t('tools', 'Tools', tools().length)
    + Object.keys(KIND).map(k => t(k, KIND[k].label, tabLinks(k).length)).join('')
    + tabSecs().map(g => t('s:' + g.id, g.tabName || g.name.replace(/\s+employees$/i, ''), citems().filter(c => c.category === g.id).length)).join('')
    + (glossOn() ? t('gloss', 'Glossary', glossary().length) : '') + '</div>';
}

function searchHtml() {
  const scope = S.tab === 'all' ? 'everything' : S.tab === 'tools' ? 'the tools' : 'this tab';
  const ts = (S.tab === 'all' || S.tab === 'tools') ? tools().filter(t => matches(t, S.q)).sort(byStatus) : [];
  const ls = S.tab === 'gloss' ? [] : tabLinks(S.tab).filter(c => cmatches(c, S.q));
  const gs = (S.tab === 'all' || S.tab === 'gloss') ? glossary().filter(g => gmatches(g, S.q)) : [];
  const n = ts.length + ls.length + gs.length;
  let h = '<p class="shown big" role="status">' + n + ' result' + (n === 1 ? '' : 's') + ' for “' + esc(S.q) + '” in ' + (S.tab === 'gloss' ? 'the glossary' : scope)
    + (S.tab !== 'all' ? ' · <button type="button" class="lnk" data-tab="all">search everything</button>' : '') + '</p>';
  if (ts.length) h += '<h2 class="sh">Tools</h2><div class="trow">' + ts.map(toolTile).join('') + '</div>';
  if (ls.length) h += '<h2 class="sh">Links</h2>' + catalogCards(ls, { byKind: true });
  if (gs.length) h += '<h2 class="sh">Glossary</h2><div class="gloss">' + glossHtml(gs) + '</div>';
  if (!n) h += '<div class="empty">Nothing matches. Try fewer words, or clear the search (Esc).'
    + (CATALOG.meta.contact ? ' Looking for something that is not here? <a href="' + esc(mailto('Suggestion for the Sustainment Dashboard', 'I looked for “' + S.q + '” and did not find it.\n\nWhat I was looking for:\nIts link, if I have it:\n')) + '">Tell us</a>.' : '') + '</div>';
  return h;
}

// a section's own tab. One holding dated links (Training: sessions) is split into what to open now, what is coming and
// what has happened; a section with no dates is its one card.
function sectionTab(id) {
  const g = cats().find(k => k.id === id), links = tabLinks('s:' + id);
  if (!g || !links.some(c => c.date)) return catalogCards(links, { only: id });
  const now = today();
  const res = links.filter(c => !c.date).sort(linkOrder);
  const up = links.filter(c => c.date && c.date >= now).sort((a, b) => a.date.localeCompare(b.date));
  const past = links.filter(c => c.date && c.date < now).sort((a, b) => b.date.localeCompare(a.date));
  const part = (sub, title, list, empty) => secCard({ id: '', name: title, blurb: '' }, list, { sub, color: secColor(id), empty, acts: sub === 'res' ? HOOK('sectionActs', g) : '' });
  return '<h2 class="sh">' + esc(g.name) + '<small>' + links.length + ' link' + (links.length === 1 ? '' : 's') + '</small></h2><div class="mason tri">'
    + part('res', 'Schedule & resources', res, 'Links without a date go here: the schedule, sign-ups, materials.')
    + part('up', 'Upcoming', up, 'No sessions scheduled. A link dated today or later shows here.')
    + part('past', 'Past sessions', past, 'No past sessions yet.') + '</div>';
}

// what's new (announcements, newest first, until their end date) and what's coming up (any dated link in the next 30
// days, soonest first). It sits at the top of Everything, so the page has a reason to be opened every day.
function newsHtml() {
  const now = today(), soon = (() => { const d = new Date(); d.setDate(d.getDate() + 30); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  const news = (CATALOG.notices || []).filter(n => (!n.until || n.until >= now) && n.date <= now).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
  const due = citems().filter(c => c.date && c.date >= now && c.date <= soon).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6);
  if (!news.length && !due.length && !editing()) return '';
  const nrow = n => '<li><span class="ldate">' + esc(dateTxt(n.date)) + '</span>' + (n.url ? '<a href="' + esc(linkHref(n.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(n.text) + '</a>' : '<span>' + esc(n.text) + '</span>') + '</li>';
  const drow = c => '<li><span class="ldate up">' + esc(c.date === now ? 'Today' : dateTxt(c.date)) + '</span>' + (hrefOf(c) ? aOpen(c, ckey(c), '', esc(c.name)) : '<span>' + esc(c.name) + '</span>')
    + '<small>' + esc((catOf(c) || {}).name || '') + '</small></li>';
  return '<div class="news"><section class="ncard"><h2>What’s new' + HOOK('newsActs') + '</h2>' + (news.length ? '<ul>' + news.map(nrow).join('') + '</ul>' : '<p class="sempty">No announcements.</p>') + '</section>'
    + '<section class="ncard"><h2>Coming up<small>next 30 days</small></h2>' + (due.length ? '<ul>' + due.map(drow).join('') + '</ul>' : '<p class="sempty">Nothing dated in the next 30 days.</p>') + '</section></div>';
}
function glossHtml(list) {
  const sorted = list.slice().sort((a, b) => a.term.localeCompare(b.term, undefined, { sensitivity: 'base' }));
  const groups = new Map();
  for (const g of sorted) { const L = /[a-z]/i.test(g.term[0]) ? g.term[0].toUpperCase() : '#'; if (!groups.has(L)) groups.set(L, []); groups.get(L).push(g); }
  let h = '';
  for (const [L, gs] of groups) h += '<div class="gl"><h3>' + esc(L) + '</h3><dl>' + gs.map(g => '<div class="gt"><dt>' + hl(g.term) + HOOK('termActs', g) + '</dt><dd>' + hl(g.meaning)
    + (g.url ? ' <a href="' + esc(linkHref(g.url)) + '" target="_blank" rel="noopener noreferrer">Read more<span class="vh"> about ' + esc(g.term) + '</span></a>' : '') + '</dd></div>').join('') + '</dl></div>';
  return h;
}
function glossTab() {
  return '<h2 class="sh">Glossary<small>' + glossary().length + ' terms used around the office</small></h2>' + HOOK('glossFoot')
    + (glossary().length ? '<div class="gloss">' + glossHtml(glossary()) + '</div>' : '<div class="empty">No terms yet.</div>');
}

function mainHtml() {
  if (S.q) return searchHtml();
  if (S.tab === 'tools') return toolsTab();
  if (KIND[S.tab]) {
    const ls = tabLinks(S.tab);
    return '<h2 class="sh">' + esc(KIND[S.tab].label) + '<small>' + ls.length + ' link' + (ls.length === 1 ? '' : 's') + ', by section</small></h2>'
      + (catalogCards(ls, { byKind: true }) || '<div class="empty">No ' + esc(KIND[S.tab].label.toLowerCase()) + ' in the catalog yet.</div>');
  }
  if (S.tab.startsWith('s:')) return sectionTab(S.tab.slice(2));
  if (S.tab === 'gloss') return glossTab();
  // Everything
  const T = tools().slice().sort(byStatus);
  return newsHtml() + recentHtml() + pinnedHtml()
    + '<h2 class="sh">Tools<small><button type="button" class="lnk" data-tab="tools">all tools ›</button></small></h2><div class="trow">' + T.map(t => editing() ? '<div class="ttw">' + toolTile(t) + HOOK('toolActs', t) + '</div>' : toolTile(t)).join('') + '</div>'
    + '<h2 class="sh">Catalog<small>' + cats().length + ' sections · ' + citems().length + ' links</small></h2>'
    + (catalogCards(citems(), { cap: true }) || '<div class="empty">No links yet.</div>') + (editing() ? HOOK('catalogFoot') : '');
}

function draw() {
  if (!tabOk(S.tab)) S.tab = 'all';   // a section deleted, or no longer a tab, while it was open
  HOOK('drawBar');
  document.getElementById('heroTabs').innerHTML = tabsHtml();
  document.getElementById('pinCount').textContent = pins().filter(k => citems().some(c => ckey(c) === k)).length;
  const up = updatedTxt();
  document.getElementById('updStamp').innerHTML = up ? ' <span class="upd">Links updated ' + esc(up) + '</span>' : '';
  document.getElementById('suggestSlot').innerHTML = CATALOG.meta.contact ? '<a class="tpill" href="' + esc(mailto('Suggestion for the Sustainment Dashboard',
    'A link, file, form or website the office should have on the dashboard:\n\nName:\nLink:\nWhich section:\nWhy it is useful:\n')) + '">' + UI.plus + 'Suggest a link</a>' : '';
  // a copy opened from the Downloads folder is a copy someone saved once, and it does not change when the links do
  const path = (() => { try { return decodeURIComponent(location.pathname); } catch { return location.pathname; } })();
  const stale = location.protocol === 'file:' && (/[\\/]downloads[\\/]/i.test(path) || /\(\d+\)\.html?$/i.test(path));
  document.getElementById('staleNote').innerHTML = stale && !HAS_MAINT ? '<p class="stale" role="note"><b>This is a downloaded copy</b>' + (up ? ', with links as of ' + esc(up) : '')
    + '. It does not change when someone else updates the dashboard: open it from Teams again to see the latest. If you edit links here, Save, then upload it back to Teams (Help explains).</p>' : '';
  const main = document.getElementById('main');
  main.innerHTML = mainHtml() + '<footer class="foot">This page holds no data: it is a list of links. Pins and recently opened are kept in your browser only.' + HOOK('footNote') + ' <span class="ver">Sustainment Dashboard ' + VERSION + '</span></footer>';
  if (noHover()) main.querySelectorAll('.lmore:empty').forEach(m => { const c = citems().find(x => ckey(x) === m.dataset.k); if (c) m.innerHTML = lmoreHtml(c, m.dataset.k); });
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2200);
}
function remember(id) {
  const ids = store.get('recent', []).filter(x => x !== id);
  ids.unshift(id); store.set('recent', ids.slice(0, 8));
}
async function copyCat(k) {
  const c = citems().find(x => ckey(x) === k);
  if (c && linkOk(c.url)) return copyLink({ name: c.name, url: c.url });
}
function togglePin(k) {
  const P = pins(), i = P.indexOf(k);
  if (i >= 0) P.splice(i, 1); else P.push(k);
  store.set('pins', P); draw();
  (document.querySelector('.lrow [data-pin="' + CSS.escape(k) + '"]') || document.querySelector('[data-pin="' + CSS.escape(k) + '"]') || document.getElementById('q')).focus({ preventScroll: true });
  toast(i >= 0 ? 'Unpinned' : 'Pinned to the top');
}
async function copyLink(t) {
  const u = t.url.trim();
  try { await navigator.clipboard.writeText(u); toast('Link to ' + t.name + ' copied'); return; } catch {}
  // a browser that refuses the clipboard: put the link in a box the person can copy from
  window.prompt('Copy the link to ' + t.name + ':', u);
}


// ---- How this page works: the questions people ask in the first week
function openHelp() {
  const d = document.getElementById('hdlg');
  const q = (t, a) => '<details><summary>' + t + '</summary><div>' + a + '</div></details>';
  d.innerHTML = '<div class="sdlg-in"><header><h2 id="hdlgT">How this page works</h2><button type="button" class="x" data-x="close-help" aria-label="Close">×</button></header><div class="help">'
    + q('Is what I see up to date?', 'Only if you opened the dashboard from Teams. A copy in your Downloads folder stays as it was the day you saved it. '
      + (updatedTxt() ? 'This copy’s links were updated ' + esc(updatedTxt()) + '.' : '') + ' Bookmark the dashboard in Teams and open it from there.')
    + q('Why does Excel (or PowerPoint, Word) open instead of the browser?', 'Office files open in the desktop app, where they work fully, never in a read-only preview. '
      + 'The first time, your browser asks whether this page may open Excel: tick “Always allow”. Prefer the browser? Hover over the link and choose Browser.')
    + q('What are the stars and the tiles at the top?', 'Star (☆) any link to pin it. Pinned links are the big tiles at the top of Everything. Pins are kept in your browser, so everyone builds their own set; the × on a tile unpins it.')
    + q('How do I find something fast?', 'Press / anywhere and type. Search covers the tools, every link, their notes and keywords, and the glossary. The tabs narrow it: Files, Websites, Forms, and your service’s own tab.')
    + q('Can I add or fix a link myself?', 'Yes, anyone can. Press <b>Edit links</b> at the top, type your name once, then use <b>+ Link</b> on a section, or the pencil and bin on a link. Deleted things go to <b>Recently deleted</b>, where anyone can restore them, and the <b>Change log</b> shows who changed what.')
    + q('How do I save my changes back to Teams?', 'Press <b>Save</b>. If others may have changed the dashboard since you opened it, download it from Teams again and choose it in step 1: your changes are added to theirs, so nobody’s work is lost. Then in Teams: the channel’s <b>Files</b> › <b>Upload</b> › your saved file › <b>Replace</b>.')
    + q('Is there an easier way to save?', 'Yes: sync the Teams folder once. In Teams, open the channel’s <b>Files</b> and choose <b>Sync</b> (or <b>Add shortcut to OneDrive</b>). The folder then appears in File Explorer. Open the dashboard from there, bookmark it, and Save goes straight back to Teams, merging with anyone else’s changes, with no download or upload.')
    + q('A link does not work, or something is missing.', CATALOG.meta.contact ? 'Use the flag (⚑) on the link to report it, or Suggest a link at the top. Both open an email to ' + esc(CATALOG.meta.contact) + ' with the details filled in.'
      : 'Tell the person who looks after the dashboard.')
    + q('Can I use it on my phone?', 'Not in the Teams phone app, which cannot run a page like this one. Use it on a computer, in Edge or Chrome.')
    + '</div></div>';
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
  d.querySelector('summary').focus();
}

// the maintainer copy adds src/maint.js (the Settings panel); the team copy has none of it, so this is false there
const HAS_MAINT = typeof openSettings === 'function';

function boot() {
  document.getElementById('app').innerHTML =
    '<header class="top"><h1 class="brand">' + ICONS.hub() + '<span>' + esc(DASH.title) + '</span></h1>'
    + '<div class="tr"><span id="suggestSlot"></span><button type="button" class="tpill" id="helpBtn" aria-haspopup="dialog">' + UI.help + 'Help</button><a class="tpill" href="#pinned">' + UI.pinOn + 'Pinned <b id="pinCount"></b></a>'
    + (HAS_MAINT ? '<button type="button" class="gear" id="gear" aria-haspopup="dialog" title="Settings: latest versions">' + UI.gear + '<span>Settings</span></button>' : '') + '</div></header>'
    + '<div class="maint" id="maintBar"></div>'
    + '<div id="staleNote"></div>'
    + '<div class="hero2"><h2>' + greet() + '. What do you need?</h2><p>Every tool, tracker, form and website the office uses, one search away.<span id="updStamp"></span></p>'
    + '<div class="sbox" role="search">' + UI.search + '<label class="vh" for="q">Search the tools and the catalog</label>'
    + '<input id="q" type="search" placeholder="Search tools, trackers, forms and websites" autocomplete="off"><kbd>/</kbd></div>'
    + '<nav id="heroTabs" aria-label="Show"></nav></div>'
    + '<main id="main" tabindex="-1"></main>'
    + '<div class="toast" id="toast" role="status" hidden></div>'
    + '<dialog class="sdlg" id="hdlg" aria-labelledby="hdlgT"></dialog>'
    + '<dialog class="sdlg" id="sdlg" aria-labelledby="sdlgT"></dialog>';
  HOOK('init');
  const q = document.getElementById('q');
  // search after a short pause in typing, so a fast typist is not made to wait for every letter's redraw
  let qT = 0;
  q.addEventListener('input', () => { clearTimeout(qT); const v = q.value.trim(); if (!v) { S.q = ''; draw(); return; } qT = setTimeout(() => { S.q = q.value.trim(); draw(); }, 140); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qT); S.q = q.value.trim(); draw(); } });
  document.addEventListener('mouseover', rowReached); document.addEventListener('focusin', rowReached);
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); q.focus(); }
    else if (e.key === 'Escape' && document.activeElement === q && q.value) { q.value = ''; S.q = ''; draw(); }
  });
  document.addEventListener('click', e => {
    if (HAS_MAINT && e.target.closest('#gear')) { openSettings(); return; }
    if (e.target.closest('#helpBtn')) { openHelp(); return; }
    if (e.target.closest('[data-x="close-help"]')) { document.getElementById('hdlg').close(); return; }
    const tb = e.target.closest('[data-tab]');
    if (tb) {
      S.tab = tb.dataset.tab; store.set('tab', S.tab);
      if (tb.classList.contains('lnk') && S.q === '') window.scrollTo(0, 0);
      draw(); document.querySelector('.tabs [data-tab="' + CSS.escape(S.tab) + '"]')?.focus(); return;
    }
    const mo = e.target.closest('[data-more]');
    if (mo) { S.more.add(mo.dataset.more); draw(); document.querySelector('#sc-' + CSS.escape(mo.dataset.more))?.closest('.scard')?.querySelectorAll('.lrow')[CARD_CAP]?.querySelector('.cname')?.focus(); return; }
    const s = e.target.closest('[data-status]');
    if (s) { S.status = s.dataset.status; store.set('status', S.status); draw(); document.querySelector('[data-status="' + CSS.escape(S.status) + '"]')?.focus(); return; }
    const pn = e.target.closest('[data-pin]');
    if (pn) { togglePin(pn.dataset.pin); return; }
    const cc = e.target.closest('[data-ccopy]');
    if (cc) { copyCat(cc.dataset.ccopy); return; }
    const c = e.target.closest('[data-copy]');
    if (c) { const t = tools().find(x => x.id === c.dataset.copy); if (t) copyLink(t); return; }
    const o = e.target.closest('[data-open]');
    if (o) remember(o.dataset.open);
  });
  // a link opened with the middle button counts as opened too
  document.addEventListener('auxclick', e => { const o = e.target.closest('[data-open]'); if (o) remember(o.dataset.open); });
  draw();
}
boot();
</script>
</body>
